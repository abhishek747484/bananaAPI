<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6d142">
  <title>Log in · BananaQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <a class="brand auth-brand" href="/"><span class="brand-mark">🍌</span> Banana<span>Quest</span></a>
  <main class="auth-shell">
    <section class="auth-aside">
      <div class="aside-orb">🧠</div>
      <h1>Your next<br>high score is<br>one login away.</h1>
      <div class="aside-bottom">Your game session stays yours.</div>
    </section>
    <section class="auth-panel">
      <a class="back-link" href="/">Back home</a>
      <div class="auth-heading"><h2>Log in to play</h2></div>
      <form id="loginForm" class="auth-form">
        <label>Email address<input name="email" type="email" placeholder="you@example.com" required autocomplete="email"></label>
        <label>Password<input name="password" type="password" placeholder="Your password" required autocomplete="current-password"></label>
        <p id="formMessage" class="form-message" role="status"></p>
        <button class="button auth-submit" type="submit">Log in</button>
      </form>
      <p class="auth-switch">New to BananaQuest? <a href="/pages/register.html">Create an account</a></p>
    </section>
  </main>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script>
</body>
</html>
