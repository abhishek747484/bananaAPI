<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account · BananaQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <a class="brand auth-brand" href="/"><span class="brand-mark">🍌</span> Banana<span>Quest</span></a>
  <main class="auth-shell">
    <section class="auth-aside"><div class="aside-orb">🍌</div><div class="eyebrow">YOUR QUEST STARTS HERE</div><h1>Make room<br>for a little<br><span>brain play.</span></h1><p>Create your player identity and pick up where your next great game begins.</p><div class="aside-bottom">✦ Memory first. Banana challenge next.</div></section>
    <section class="auth-panel">
      <a class="back-link" href="/">← Back home</a>
      <div class="auth-heading"><div class="eyebrow">NEW PLAYER</div><h2>Create your account</h2><p>It only takes a moment.</p></div>
      <form id="registerForm" class="auth-form">
        <label>Username<input name="username" type="text" minlength="3" maxlength="24" placeholder="Choose a player name" required autocomplete="username"></label>
        <label>Email address<input name="email" type="email" placeholder="you@example.com" required autocomplete="email"></label>
        <label>Password<input name="password" type="password" minlength="8" placeholder="At least 8 characters" required autocomplete="new-password"></label>
        <p id="formMessage" class="form-message" role="status"></p>
        <button class="button auth-submit" type="submit">Create account <span>→</span></button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/pages/login.html">Log in</a></p>
    </section>
  </main>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script>
</body>
</html>
